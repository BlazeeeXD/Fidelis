name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests — one job per service, run from inside the service directory
  # (matches how developers run pytest locally).
  # ---------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orchestrator, webhook, gateway, reviewer, learner]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          GITHUB_WEBHOOK_SECRET: testsecret
        run: pytest

  # ---------------------------------------------------------------------------
  # Lint — keep the repository's full service tree clean.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check services/

  # ---------------------------------------------------------------------------
  # Docker smoke — build the whole compose stack, wait for healthchecks, then
  # run scripts/smoke_test.py end-to-end (health -> JWT -> job -> webhook).
  # ---------------------------------------------------------------------------
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create deterministic CI environment
        run: |
          cp .env.example .env
          # The integration fixtures reference synthetic repositories and must
          # never call a paid/external model or publish comments to GitHub.
          sed -i 's/^REVIEWER_MODE=.*/REVIEWER_MODE=mock/' .env
          sed -i 's/^PUBLISH_GITHUB_REVIEWS=.*/PUBLISH_GITHUB_REVIEWS=false/' .env

      - name: Build and start stack
        run: docker compose up -d --build --wait

      - name: Run smoke test
        run: python scripts/smoke_test.py

      - name: Run webhook → job integration tests
        run: |
          pip install -r requirements-dev.txt
          pytest tests/integration -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
