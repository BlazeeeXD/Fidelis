name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests — one job per service, run from inside the service directory
  # (matches how developers run pytest locally).
  # ---------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orchestrator, webhook, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          GITHUB_WEBHOOK_SECRET: testsecret
        run: pytest

  # ---------------------------------------------------------------------------
  # Lint — existing code hasn't been linted yet, so this is advisory for now.
  # Flip continue-on-error to false once the backlog is cleaned up.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check services/

  # ---------------------------------------------------------------------------
  # Docker smoke — build the whole compose stack, wait for healthchecks, then
  # run scripts/smoke_test.py end-to-end (health -> JWT -> job -> webhook).
  # ---------------------------------------------------------------------------
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create .env from template
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up -d --build --wait

      - name: Run smoke test
        run: python scripts/smoke_test.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
